name: VAAK-1 RTL & Synthesis CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-and-synthesize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Icarus Verilog & Yosys
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys

      - name: Simulate Ternary NPU Core
        run: |
          iverilog -g2012 -o sim_npu.out rtl/ternary_npu_core.sv rtl/tb/tb_ternary_npu.sv
          vvp sim_npu.out

      - name: Simulate DRAM-Free SRAM Subsystem
        run: |
          iverilog -g2012 -o sim_sub.out rtl/ternary_npu_core.sv rtl/sram_weight_streamer.sv rtl/tb/tb_vaak1_subsystem.sv
          vvp sim_sub.out

      - name: Simulate Full RISC-V + NPU SoC (vaak1_soc_top)
        run: |
          iverilog -g2012 -o sim_soc.out rtl/vaak1_soc_top.sv rtl/tb/tb_vaak1_soc.sv
          vvp sim_soc.out

      - name: Gate-Level Synthesis Check (Yosys)
        run: |
          yosys -s synth/synth_vaak1.ys
          yosys -p "read_verilog -sv rtl/vaak1_soc_top.sv; hierarchy -check -top vaak1_soc_top; proc; opt; stat"
