name: VAAK-1 Silicon Verification

on:
  push:
    branches: [ main ]

jobs:
  simulate-rtl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VAAK-1 RTL
        uses: actions/checkout@v4

      - name: Install Open-Source Chip Simulator (Icarus Verilog)
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Compile & Run Ternary NPU Testbench
        run: |
          iverilog -g2012 -o vaak1_sim rtl/ternary_npu_core.sv tb/tb_ternary_npu.sv
          vvp vaak1_sim
