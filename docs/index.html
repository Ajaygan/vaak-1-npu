<head>

  <style>
    :root {
      --bg: #080b10;
      --surface: rgba(16, 22, 33, 0.78);
      --border: rgba(56, 189, 248, 0.22);
      --accent: #38bdf8;
      --accent-green: #10b981;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 15% 10%, #0f1c2e 0%, var(--bg) 55%);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      line-height: 1.6;
      min-height: 100vh;
    }

    .container { max-width: 1180px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding-bottom: 1.75rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2rem;
    }
    .brand h1 {
      font-family: 'Bungee', sans-serif;
      font-size: 2.2rem;
      letter-spacing: 1.5px;
      background: linear-gradient(90deg, #38bdf8, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand p { color: var(--muted); font-size: 0.95rem; margin-top: 0.2rem; }
    .badges { display: flex; flex-wrap: wrap; gap: 0.6rem; }
    .badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      padding: 0.38rem 0.75rem;
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid var(--border);
      color: var(--accent);
    }
    .badge.green { background: rgba(16, 185, 129, 0.12); border-color: rgba(16, 185, 129, 0.35); color: #34d399; }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .kpi {
      background: var(--surface);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.15rem 1.25rem;
    }
    .kpi .label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
    .kpi .val { font-family: 'JetBrains Mono', monospace; font-size: 1.65rem; font-weight: 700; margin: 0.25rem 0; color: #fff; }
    .kpi .sub { font-size: 0.82rem; color: #34d399; }

    .grid-2 {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

    .card {
      background: var(--surface);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
    }
